context:
  name: Maartens_Resource_Compiler
  version: "1.3.17"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://forge.hekkelman.net/maarten/mrc/archive/v${{ version }}.tar.gz
  sha256: 0d638fb534161d56906b30099891e95c6286e0e96a33cdfaa613f92234a7adfd

build:
  number: 1
  skip:
    - osx
  script:
    - if: unix
      then: |
        set -exo pipefail
        cmake -S . -B build ${CMAKE_ARGS} -DBUILD_TESTING=ON
        cmake --build build --config Release --parallel ${CPU_COUNT}
        ctest -V -C Release --test-dir build
        cmake --install build
      else: |
        @echo on
        cmake -S . -B build %CMAKE_ARGS% -DBUILD_TESTING=ON
        if errorlevel 1 exit 1
        cmake --build build --config Release --parallel %CPU_COUNT%
        if errorlevel 1 exit 1
        ctest -V -C Release --test-dir build
        if errorlevel 1 exit 1
        cmake --install build
        if errorlevel 1 exit 1

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - if: unix
      then: make
    - pkg-config
  host:
    - catch2
    - libmcfp

tests:
  - script:
      - mrc --version
      - mrc --header -o mrsrc.h

about:
  homepage: https://forge.hekkelman.net/maarten/mrc
  repository: https://forge.hekkelman.net/maarten/mrc
  documentation: https://forge.hekkelman.net/maarten/mrc/src/tag/v${{ version }}/README.md
  license: BSD-2-Clause
  license_file: LICENSE
  summary: "mrc - Maartens Resource Compiler"
  description: >
    MRC is a tool for parsing and compiling resource files.
    It provides functionality to handle various resource formats and compile them into binary resources for use in applications.

extra:
  recipe-maintainers:
    - eunos-1128
